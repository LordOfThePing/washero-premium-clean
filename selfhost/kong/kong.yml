_format_version: "2.1"
_transform: true

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1/

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1/

  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-route
        strip_path: true
        paths:
          - /storage/v1/

  - name: realtime-v1
    url: http://realtime:4000/
    routes:
      - name: realtime-v1-route
        strip_path: true
        paths:
          - /realtime/v1/

  - name: functions-v1
    url: http://edge-runtime:8081/
    routes:
      - name: functions-v1-route
        strip_path: true
        paths:
          - /functions/v1/
